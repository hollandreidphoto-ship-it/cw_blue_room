<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CW Blue Room Prototype</title>
<style>
:root{--gold:#c8a45a;--navy:#08111d;--ink:#030507;--cream:#f2eee5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020407;color:#fff;font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden}.intro{position:fixed;inset:0;display:grid;place-items:center;background:#020407;z-index:99;transition:opacity .9s ease,visibility .9s ease}.intro.hide{opacity:0;visibility:hidden}.intro-inner{text-align:center}.mark{font:700 clamp(46px,8vw,110px)/.9 Georgia,serif;color:var(--gold);letter-spacing:.05em}.enter{margin-top:28px;background:transparent;border:1px solid rgba(200,164,90,.65);color:#fff;padding:13px 26px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer}.page{min-height:100vh;display:grid;place-items:center;padding:18px}.frame{position:relative;width:min(100%,177.78vh);aspect-ratio:16/9;overflow:hidden;background:#09111c;box-shadow:0 30px 90px rgba(0,0,0,.65)}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 47%,transparent 35%,rgba(0,0,0,.4) 78%,rgba(0,0,0,.7) 100%);pointer-events:none}.hotspot{position:absolute;transform:translate(-50%,-50%);width:clamp(34px,3.2vw,58px);height:clamp(34px,3.2vw,58px);border-radius:50%;border:1px solid rgba(235,204,132,.8);background:rgba(5,10,18,.32);cursor:pointer;box-shadow:0 0 0 0 rgba(200,164,90,.25);transition:.2s ease;backdrop-filter:blur(2px)}.hotspot::before{content:"";position:absolute;inset:30%;border-radius:50%;background:var(--gold)}.hotspot:hover,.hotspot:focus-visible{transform:translate(-50%,-50%) scale(1.12);box-shadow:0 0 0 10px rgba(200,164,90,.12);outline:none}.tag{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#f8edd2;background:rgba(0,0,0,.66);padding:5px 8px;border-radius:999px;opacity:0;transition:.2s}.hotspot:hover .tag,.hotspot:focus-visible .tag{opacity:1}.logo{position:absolute;left:3%;top:4%;font:700 clamp(18px,2.4vw,36px)/1 Georgia,serif;color:#e3c47c;letter-spacing:.06em;text-shadow:0 2px 14px #000}.hint{position:absolute;left:50%;bottom:3.5%;transform:translateX(-50%);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.75);background:rgba(0,0,0,.4);padding:8px 12px;border-radius:999px}.panel{position:fixed;inset:0;background:rgba(1,3,6,.76);display:none;place-items:center;padding:20px;z-index:70}.panel.open{display:grid}.card{width:min(860px,94vw);max-height:88vh;overflow:auto;background:#0a111c;border:1px solid rgba(200,164,90,.35);box-shadow:0 30px 90px #000;border-radius:18px;padding:18px}.card-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.card h2{font:600 clamp(26px,4vw,46px)/1 Georgia,serif;margin:4px 0 6px;color:#edd596}.card p{margin:0;color:#c8ced8;line-height:1.5}.close{border:1px solid rgba(255,255,255,.24);background:transparent;color:#fff;border-radius:999px;width:42px;height:42px;cursor:pointer;font-size:20px}.preview{margin-top:16px;background:#05080d;border-radius:12px;overflow:hidden;display:grid;place-items:center;min-height:240px}.preview img{display:block;max-width:100%;max-height:54vh;object-fit:contain}.action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.action{padding:11px 14px;border:1px solid rgba(200,164,90,.45);color:#f5e8c7;background:rgba(200,164,90,.08);border-radius:999px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}@media(max-width:700px){.page{padding:0}.frame{width:100%;box-shadow:none}.hint,.tag{display:none}}
</style>
</head>
<body>
<div class="intro" id="intro"><div class="intro-inner"><div class="mark">CW</div><button class="enter" id="enterBtn">Enter the Blue Room</button></div></div>
<main class="page"><section class="frame" aria-label="Interactive CW Blue Room prototype"><img class="bg" src="assets/Room.png" alt="CW Blue Room interior"><div class="vignette"></div><div class="logo">CW</div>
<button class="hotspot" style="left:49.5%;top:48%" data-key="microphone" aria-label="Open music"><span class="tag">Music</span></button><button class="hotspot" style="left:51%;top:39%" data-key="fedora" aria-label="Open hat collection"><span class="tag">Hats</span></button><button class="hotspot" style="left:17%;top:41%" data-key="hat-display" aria-label="Open hat display"><span class="tag">Hat Collection</span></button><button class="hotspot" style="left:75%;top:61%" data-key="chair" aria-label="Open lounge"><span class="tag">Lounge</span></button><button class="hotspot" style="left:84%;top:66%" data-key="side-table" aria-label="Open table details"><span class="tag">Details</span></button><button class="hotspot" style="left:86%;top:57%" data-key="cigar" aria-label="Open cigar details"><span class="tag">Cigar</span></button><button class="hotspot" style="left:90%;top:51%" data-key="decanter" aria-label="Open bar details"><span class="tag">Bar</span></button><button class="hotspot" style="left:92%;top:33%" data-key="vip" aria-label="Open VIP backstage concept"><span class="tag">VIP</span></button><div class="hint">Select a gold hotspot to explore</div></section></main>
<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle"><article class="card"><div class="card-top"><div><h2 id="panelTitle">CW Blue Room</h2><p id="panelText"></p></div><button class="close" id="closeBtn" aria-label="Close">×</button></div><div class="preview" id="preview"></div><div class="action-row" id="actions"></div></article></div>
<script>
const items={microphone:{title:"Music",text:"Stage and music interaction. This is where Christopher's music, performance clips or featured track can open.",img:"assets/microphone.png",actions:["Listen","Watch","Discography"]},fedora:{title:"CW Hats",text:"Primary entry point into the Christopher Williams hat collection.",img:null,actions:["Shop hats","Signature collection"]},"hat-display":{title:"Hat Collection",text:"Browse the wider CW hat assortment and featured silhouettes.",img:null,actions:["Browse collection","New arrivals"]},chair:{title:"The Lounge",text:"Atmosphere and storytelling space. This can later hold editorial content, interviews or featured drops.",img:null,actions:["Explore"]},"side-table":{title:"Blue Room Details",text:"A detail hotspot for lifestyle merchandise and storytelling.",img:null,actions:["View details"]},cigar:{title:"Cigar Table",text:"Lifestyle/accessories placeholder. Keep or remove depending on the final merchandise plan.",img:null,actions:["Explore"]},decanter:{title:"The Bar",text:"Bar and lifestyle interaction. This can later connect to glassware, accessories or branded content.",img:null,actions:["Explore"]},vip:{title:"VIP Backstage",text:"Reserved for subscribers, premium access, backstage content or exclusive releases.",img:null,actions:["VIP access","Backstage"]}};
const intro=document.getElementById('intro');document.getElementById('enterBtn').addEventListener('click',()=>intro.classList.add('hide'));const panel=document.getElementById('panel'),title=document.getElementById('panelTitle'),text=document.getElementById('panelText'),preview=document.getElementById('preview'),actions=document.getElementById('actions');function openItem(key){const d=items[key];if(!d)return;title.textContent=d.title;text.textContent=d.text;preview.innerHTML=d.img?`<img src="${d.img}" alt="${d.title} asset preview">`:`<div style="padding:70px 20px;text-align:center;color:#d9c79e;letter-spacing:.14em;text-transform:uppercase">Interactive destination coming next</div>`;actions.innerHTML=d.actions.map(a=>`<span class="action">${a}</span>`).join('');panel.classList.add('open');document.getElementById('closeBtn').focus()}document.querySelectorAll('.hotspot').forEach(b=>b.addEventListener('click',()=>openItem(b.dataset.key)));function closePanel(){panel.classList.remove('open')}document.getElementById('closeBtn').addEventListener('click',closePanel);panel.addEventListener('click',e=>{if(e.target===panel)closePanel()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
</script></body></html>
